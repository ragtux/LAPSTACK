# lapstack-raw is LGPL-2.1 (see LICENSE and README.md): a work based on rawler,
# built and distributed as a component of its own that lapstack loads at run
# time. It inherits nothing from the lapstack workspace so that this directory
# and vendor/rawler build on their own, from the source tarball that ships
# with the app (web/dist.sh).
[package]
name = "lapstack-raw"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-only"
authors = ["RAGTUX LLC"]
publish = false
description = "Camera raw decoding for lapstack (rawler), as a separately loaded module: a shared library natively, a wasm module in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rawler = { path = "../../vendor/rawler", default-features = false }
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }   # rawler's uuid wants a source of randomness on wasm
