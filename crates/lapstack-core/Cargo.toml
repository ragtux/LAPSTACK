[package]
name = "lapstack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Laplacian-pyramid focus stacking (Burt & Adelson 1983/84; Wang & Chang 2011)"

[dependencies]
image.workspace = true
rayon.workspace = true
# metadata pass-through (meta.rs): PNG iCCP / iTXt are zlib streams
flate2 = "1"
cudarc = { workspace = true, optional = true }
# the raw decoder's color and metadata descriptions (raw.rs) are JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# the wgpu engine (`wg/`): the browser app's WebGPU kernels, and the same kernels on a
# native GPU through Vulkan, Metal or DX12 (`--gpu` without CUDA)
bytemuck = { version = "1", features = ["derive"], optional = true }
futures-channel = { version = "0.3", optional = true }

# camera raw input (raw.rs): the lapstack-raw shared library, loaded at run time
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { version = "0.8", optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu"], optional = true }
# `wg/gpu.rs` yields to the browser's event loop between transfer slices
wasm-bindgen = { version = "0.2.128", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["MessageChannel", "MessagePort"], optional = true }

[features]
default = ["raw"]
# camera raw input (raw.rs): NEF, CR2/CR3, ARW, DNG, RAF, … developed by the
# lapstack-raw library (crates/lapstack-raw, LGPL), found beside the binary at run time
raw = ["dep:libloading"]
# CUDA fusion + CUDA aligner cost search (`gpu.rs`). Runtime-loaded: no CUDA
# toolkit needed at build time.
gpu = ["dep:cudarc"]
# The wgpu engine (`wg/`): fusion, alignment and the depth pass as WGSL kernels —
# WebGPU in the browser app, Vulkan / Metal / DX12 natively (`--gpu` on any GPU).
wgpu = ["dep:wgpu", "dep:bytemuck", "dep:futures-channel", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
