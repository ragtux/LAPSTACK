[package]
name = "lapstack-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "lapstack: CLI for the Laplacian-pyramid focus stacker"

[[bin]]
name = "lapstack"
path = "src/main.rs"

[dependencies]
lapstack-core = { path = "../lapstack-core" }

[features]
gpu = ["lapstack-core/gpu"]
# the wgpu engine: --gpu on Vulkan, Metal or DX12 (the browser app's kernels)
wgpu = ["lapstack-core/wgpu"]
