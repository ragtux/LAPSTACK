<meta charset="utf-8">
<title>lapstack web test</title>
<pre id="log"></pre>
<script type="module">
// Automated check: run the worker pipeline on web/test/frames and compare the
// fused RGBA8 against expected.png (native `lapstack --no-align` on the same
// crops). Results land in window.__result (JSON) for the headless harness.
const log = (s) => { document.getElementById('log').textContent += s + '\n'; console.log(s); };
const q = new URLSearchParams(location.search);
const align = q.get('align') === '1';
const listDir = q.get('list') || 'test/frames';       // directory with list.json
const expectedUrl = q.has('expected') ? q.get('expected') : 'test/expected.png'; // '' = skip the comparison
const coarsen = Number(q.get('coarsen') || 1);
const interp = q.get('interp') || 'spline4x4';
const model = q.get('model') || 'similarity';           // the alignment model (similarity | affine | projective)          // the warp's kernel (nearest | bilinear | bicubic | spline4x4 | spline6x6 | lanczos3)
const depthMode = q.get('depth') || 'dff';                 // dff | winner
const halo = Number(q.get('halo') || 0);                    // halo control hardness (0 = off)
const depthScale = Number(q.get('depth_scale') || 2);
const render = q.get('render') === '1';                     // also render from the depth map (second pass)
const expectedDff = q.has('expected_dff') ? q.get('expected_dff') : 'test/expected_dff.u16'; // raw u16 LE, '' = skip
const expectedConf = q.has('expected_conf') ? q.get('expected_conf') : 'test/expected_conf.u16'; // raw u16 LE of the confidence (65535 = 1), '' = skip
const worker = new Worker('./worker.js?t=' + Date.now(), { type: 'module' });
const wait = (type) => new Promise((res, rej) => {
  const h = (ev) => { const m = ev.data; if (m.type === 'error') { worker.removeEventListener('message', h); rej(new Error(m.text)); }
    if (m.type === type) { worker.removeEventListener('message', h); res(m); } };
  worker.addEventListener('message', h);
});
async function decodeExpected() {
  const blob = await (await fetch('./' + expectedUrl)).blob();
  const bmp = await createImageBitmap(blob, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
  const c = new OffscreenCanvas(bmp.width, bmp.height);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0);
  return { w: bmp.width, h: bmp.height, data: ctx.getImageData(0, 0, bmp.width, bmp.height).data };
}
try {
  worker.addEventListener('message', (ev) => { if (ev.data.type === 'debug') log('debug: ' + ev.data.text); });
  const ready = wait('ready');
  worker.postMessage({ type: 'init', debug: true });
  const info = (await ready).info;
  log('adapter: ' + JSON.stringify(info));
  const names = await (await fetch(`./${listDir}/list.json`)).json();
  const files = [];
  for (const n of names) files.push(new File([await (await fetch(`./${listDir}/` + n)).blob()], n));
  const frames = [];
  worker.addEventListener('message', (ev) => {
    const m = ev.data;
    if (m.type === 'frame') { frames.push(m); log(`frame ${m.index} ${m.name} ${m.w}x${m.h} ${m.bits}-bit sim=[${m.sim.map(v => v.toFixed(3))}] ${m.ms.toFixed(0)} ms`); }
    if (m.type === 'stage') log('stage: ' + m.text);
  });
  const done = wait('done');
  const done2 = render ? wait('done2') : null;
  // brightness off: the native reference was fused from the frames as they are
  worker.postMessage({ type: 'run', files, params: { align, coarsen, interp, model, halo, brightness: false, proxy_edge: 400, depth: depthMode, depth_scale: depthScale, render_dmap: render } });
  const res = await done;
  log(`done: ${res.w}x${res.h} ${res.frames} frames, ${res.ms.toFixed(0)} ms`);
  let dmap = null;
  if (render) {
    const r2 = await done2;
    // sanity: the two stacked images agree broadly (mean |diff| in 8-bit steps) but are not identical
    const a = new Uint8Array(res.rgba), b = new Uint8Array(r2.rgba); let sd = 0;
    for (let i = 0; i < a.length; i += 4) sd += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
    dmap = { ms: r2.ms, mean_abs_vs_pyramid: sd / (3 * res.w * res.h) };
    log(`depth-map render: ${r2.ms.toFixed(0)} ms, mean |diff| vs pyramid ${dmap.mean_abs_vs_pyramid.toFixed(2)}`);
  }
  const got = new Uint8Array(res.rgba);
  // the on-demand slab (retouch brush source): over every frame it is the run's own fusion
  // (same warps, gains and ties), so it must match the LAP result exactly; a partial one
  // differs from it
  let slabGen = 0;   // a newer request supersedes an older one: generations must rise
  const slabOf = async (lo, hi) => { const p = wait('slab'); worker.postMessage({ type: 'slab', lo, hi, files: files.slice(lo, hi + 1), gen: ++slabGen }); return new Uint8Array((await p).rgba); };
  const diffOf = (s, ref) => { let mx = 0, nd = 0; for (let i = 0; i < ref.length; i += 4) { const d = Math.max(Math.abs(s[i] - ref[i]), Math.abs(s[i + 1] - ref[i + 1]), Math.abs(s[i + 2] - ref[i + 2])); mx = Math.max(mx, d); if (d) nd++; } return { maxdiff: mx, ndiff_frac: nd / (res.w * res.h) }; };
  const slabDiff = (s) => diffOf(s, got);
  const slab = { full: slabDiff(await slabOf(0, res.frames - 1)), part: slabDiff(await slabOf(0, Math.max(0, res.frames >> 1))) };
  log(`slab: all frames vs LAP maxdiff ${slab.full.maxdiff}; first half vs LAP ${(100 * slab.part.ndiff_frac).toFixed(1)} % of pixels differ`);
  if (slab.full.maxdiff !== 0) throw new Error(`a slab of every frame differs from the LAP result (maxdiff ${slab.full.maxdiff})`);
  if (res.frames > 1 && slab.part.ndiff_frac === 0) throw new Error('a slab of half the frames equals the LAP result');
  let maxd = 0, ndiff = 0, sum = 0;
  if (expectedUrl) {
    const exp = await decodeExpected();
    if (exp.w !== res.w || exp.h !== res.h) throw new Error(`size mismatch ${exp.w}x${exp.h} vs ${res.w}x${res.h}`);
    for (let i = 0; i < res.w * res.h; i++) {
      let pd = 0;
      for (let c = 0; c < 3; c++) { const d = Math.abs(got[4 * i + c] - exp.data[4 * i + c]); pd = Math.max(pd, d); sum += d; }
      if (pd > 0) ndiff++;
      maxd = Math.max(maxd, pd);
    }
  }
  const depth = new Float32Array(res.depth);
  let dmin = Infinity, dmax = -Infinity; for (const v of depth) { dmin = Math.min(dmin, v); dmax = Math.max(dmax, v); }
  // the confidence: the depth's grid, [0, 1], empty with the winner depth
  const conf = new Float32Array(res.conf);
  if (conf.length !== (depthMode === 'dff' ? depth.length : 0)) throw new Error(`confidence size ${conf.length} vs depth ${depth.length}`);
  let cmin = Infinity, cmax = -Infinity, csum = 0; for (const v of conf) { cmin = Math.min(cmin, v); cmax = Math.max(cmax, v); csum += v; }
  if (conf.length && (cmin < 0 || cmax > 1)) throw new Error(`confidence out of [0, 1]: ${cmin}..${cmax}`);
  const pngP = wait('png'); worker.postMessage({ type: 'save', kind: 'fused' }); const png = await pngP;
  if (q.get('dump') === '1') { const u8 = new Uint8Array(png.bytes); let b64 = ''; for (let i = 0; i < u8.length; i += 0x8000) b64 += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); window.__png = btoa(b64); }   // ?dump=1: the fused PNG as base64 for the harness (PRINT_EXPR='window.__png')
  // depth from focus: full-res map vs the native reference (same frames, same scale)
  let dff = null;
  if (depthMode === 'dff') {
    const dfP = wait('depth_full'); worker.postMessage({ type: 'depth_full' }); const got16 = new Uint16Array((await dfP).data);
    dff = { n: got16.length };
    if (expectedDff) {
      const r = await fetch('./' + expectedDff);
      if (r.ok) {
        const exp16 = new Uint16Array(await r.arrayBuffer());
        if (exp16.length !== got16.length) throw new Error(`depth size mismatch ${exp16.length} vs ${got16.length}`);
        const k = (res.frames - 1) / 65535; let mx = 0, s1 = 0, within = 0;
        for (let i = 0; i < got16.length; i++) { const d = Math.abs(got16[i] - exp16[i]) * k; mx = Math.max(mx, d); s1 += d; if (d <= 0.5) within++; }
        dff = { n: got16.length, max_abs_frames: mx, mean_abs_frames: s1 / got16.length, within_half_frame: within / got16.length };
      } else log('no ' + expectedDff + ' (skipping the depth comparison)');
    }
    // the full-resolution confidence vs the native one (`--save-conf`), 65535 = 1
    const cfP = wait('conf_full'); worker.postMessage({ type: 'conf_full' }); const gotC = new Uint16Array((await cfP).data);
    if (gotC.length !== got16.length) throw new Error(`confidence size mismatch ${gotC.length} vs depth ${got16.length}`);
    dff.conf = { mean: csum / conf.length, range: [cmin, cmax] };
    if (expectedConf) {
      const r = await fetch('./' + expectedConf);
      if (r.ok) {
        const expC = new Uint16Array(await r.arrayBuffer());
        if (expC.length !== gotC.length) throw new Error(`confidence size mismatch ${expC.length} vs ${gotC.length}`);
        let mx = 0, s1 = 0, over = 0;   // over: pixels off by more than 0.05 (a tie between two peaks resolved the other way)
        for (let i = 0; i < gotC.length; i++) { const d = Math.abs(gotC[i] - expC[i]) / 65535; mx = Math.max(mx, d); s1 += d; if (d > 0.05) over++; }
        Object.assign(dff.conf, { max_abs: mx, mean_abs: s1 / gotC.length, over_0_05_frac: over / gotC.length });
        log(`confidence vs native: max |diff| ${mx.toFixed(4)}, mean ${(s1 / gotC.length).toFixed(5)}, ${(100 * over / gotC.length).toFixed(3)} % of pixels off by > 0.05`);
      } else log('no ' + expectedConf + ' (skipping the confidence comparison)');
    }
  }
  // slabbed DFR: LAP within slabs, the depth-map blend across the slab images. One slab of
  // every frame gets weight 1 everywhere, so that rendering is the LAP result itself; short
  // slabs give a different image. Each is a run of its own (the engine keeps one).
  const runWith = async (extra) => {
    const d1 = wait('done'), d2 = wait('done2');
    worker.postMessage({ type: 'run', files, params: { align, coarsen, interp, model, halo, brightness: false, proxy_edge: 400, depth: depthMode, depth_scale: depthScale, ...extra } });
    const a = await d1, b = await d2; return [new Uint8Array(a.rgba), new Uint8Array(b.rgba), b.ms];
  };
  const [lapA, oneSlab, msA] = await runWith({ render_dmap: true, render_slabs: true, slab_size: res.frames, slab_overlap: 0 });
  const [lapB, slabs3, msB] = await runWith({ render_dmap: true, render_slabs: true, slab_size: 3, slab_overlap: 1 });
  const slabbed = { one_slab_vs_lap: diffOf(oneSlab, lapA), slabs3_vs_lap: diffOf(slabs3, lapB), ms: [msA, msB] };
  log(`slabbed DFR: one slab vs LAP maxdiff ${slabbed.one_slab_vs_lap.maxdiff}; slabs of 3 vs LAP ${(100 * slabbed.slabs3_vs_lap.ndiff_frac).toFixed(1)} % of pixels differ (${msA.toFixed(0)} / ${msB.toFixed(0)} ms)`);
  if (slabbed.one_slab_vs_lap.maxdiff !== 0) throw new Error(`a slabbed DFR of one slab differs from the LAP result (maxdiff ${slabbed.one_slab_vs_lap.maxdiff})`);
  if (res.frames > 3 && slabbed.slabs3_vs_lap.ndiff_frac === 0) throw new Error('a slabbed DFR of 3-frame slabs equals the LAP result');
  // the dust map (dust.rs): a synthetic one — a softly lit gray frame with soft dark spots, drawn
  // on a canvas — is set in the engine, and a run with it differs from the plain run inside the
  // spots' windows (each filled from its surroundings) and hardly anywhere else
  let rid = 0;
  const rpc = (msg) => new Promise((res, rej) => { const id = ++rid; const h = (ev) => { const m = ev.data; if (m.rid !== id) return; worker.removeEventListener('message', h); if (m.type === 'rpc-error') rej(new Error(m.text)); else res(m); }; worker.addEventListener('message', h); worker.postMessage({ ...msg, rid: id }); });
  const [fw, fh] = [frames[0].w, frames[0].h];
  const SPOTS = [[fw * 0.2, fh * 0.3, 10], [fw * 0.7, fh * 0.6, 14], [fw * 0.5, fh * 0.85, 7]];
  const dustFile = await (async () => {
    const c = new OffscreenCanvas(fw, fh), g = c.getContext('2d');
    const grad = g.createRadialGradient(fw / 2, fh / 2, 0, fw / 2, fh / 2, Math.max(fw, fh) / 1.4); grad.addColorStop(0, '#e6e6e6'); grad.addColorStop(1, '#bcbcbc');
    g.fillStyle = grad; g.fillRect(0, 0, fw, fh);
    g.filter = 'blur(3px)'; g.fillStyle = 'rgba(0,0,0,0.45)';
    for (const [x, y, r] of SPOTS) { g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fill(); }
    return new File([await c.convertToBlob({ type: 'image/png' })], 'dust.png');
  })();
  const dinfo = (await rpc({ type: 'dust_set', file: dustFile, edge: 400, threshold: 0.03, margin: 3, mode: 'fill' })).info;
  log(`dust map: ${dinfo.text}`);
  if (dinfo.spots !== SPOTS.length) throw new Error(`dust map: ${dinfo.spots} spots found, ${SPOTS.length} drawn`);
  const rects = Array.from(dinfo.rects);
  for (const [x, y] of SPOTS) { let hit = false; for (let i = 0; i < rects.length; i += 4) if (x >= rects[i] && x < rects[i] + rects[i + 2] && y >= rects[i + 1] && y < rects[i + 1] + rects[i + 3]) hit = true; if (!hit) throw new Error(`dust map: no spot window covers the spot drawn at ${x.toFixed(0)},${y.toFixed(0)}`); }
  // with the first run's registration given, so the warps are the same and only the spots differ
  // (the search itself lands a little elsewhere once the spots are filled, and every pixel moves)
  const dustDone = wait('done');
  worker.postMessage({ type: 'run', files, params: { align, coarsen, interp, model, halo, brightness: false, proxy_edge: 400, depth: depthMode, depth_scale: depthScale }, sims: frames.slice(0, res.frames).map((f) => f.sim) });
  const dres = await dustDone;
  const dgot = new Uint8Array(dres.rgba);
  if (dres.w !== res.w || dres.h !== res.h) throw new Error(`the run with the dust map is ${dres.w}x${dres.h}, the plain one ${res.w}x${res.h}`);
  // the spots' windows in the (possibly cropped) result, grown by 8 px; outside them the two runs should agree
  const [cx, cy] = res.crop ? [res.crop[0], res.crop[1]] : [0, 0];
  const inWin = (x, y) => { x += cx; y += cy; for (let i = 0; i < rects.length; i += 4) if (x >= rects[i] - 8 && x < rects[i] + rects[i + 2] + 8 && y >= rects[i + 1] - 8 && y < rects[i + 1] + rects[i + 3] + 8) return true; return false; };
  let sIn = 0, nIn = 0, sOut = 0, nOut = 0;
  for (let y = 0; y < res.h; y++) for (let x = 0; x < res.w; x++) { const i = 4 * (y * res.w + x); const d = Math.abs(got[i] - dgot[i]) + Math.abs(got[i + 1] - dgot[i + 1]) + Math.abs(got[i + 2] - dgot[i + 2]); if (inWin(x, y)) { sIn += d; nIn++; } else { sOut += d; nOut++; } }
  const dust = { spots: dinfo.spots, text: dinfo.text, mean_abs_in_spots: sIn / (3 * nIn), mean_abs_outside: sOut / (3 * nOut), ms: dres.ms };
  log(`dust map run: mean |diff| vs plain run ${dust.mean_abs_in_spots.toFixed(2)} inside the spots, ${dust.mean_abs_outside.toFixed(3)} outside (${dres.ms.toFixed(0)} ms)`);
  if (dust.mean_abs_in_spots < 1) throw new Error(`the dust map changed nothing inside its spots (mean |diff| ${dust.mean_abs_in_spots})`);
  if (dust.mean_abs_outside > 0.5) throw new Error(`the dust map changed the result outside its spots (mean |diff| ${dust.mean_abs_outside})`);
  await rpc({ type: 'dust_clear' });
  const result = { ok: true, align, frames: res.frames, w: res.w, h: res.h, maxdiff: maxd, ndiff, ndiff_frac: ndiff / (res.w * res.h),
    mean_abs: sum / (3 * res.w * res.h), depth_range: [dmin, dmax], depth_dims: [res.depth_w, res.depth_h], dff, dmap, slab, slabbed, dust, png_bytes: png.bytes.byteLength, ms: res.ms,
    sims: frames.map(f => f.sim), info };
  log('RESULT ' + JSON.stringify(result));
  window.__result = JSON.stringify(result);
} catch (e) {
  log('FAIL ' + e.message);
  window.__result = JSON.stringify({ ok: false, error: e.message });
}
</script>
