[workspace]
# vendor/rawler is a patched copy of rawler (its own crate, not a member): see vendor/rawler/LAPSTACK-PATCH.md
exclude = ["vendor/rawler"]
resolver = "3"
# lapstack-raw (LGPL: rawler behind a small interface) is a member, but inherits nothing
# from the workspace, so that it builds on its own from the source tarball that ships with the app
members = ["crates/lapstack-core", "crates/lapstack-cli", "crates/lapstack-web", "crates/lapstack-cc", "crates/lapstack-raw"]
# lapstack-web and lapstack-cc only target wasm32 (see web/build.sh); keep plain
# `cargo build` working anywhere by defaulting to core + cli + the raw library the cli loads.
default-members = ["crates/lapstack-core", "crates/lapstack-cli", "crates/lapstack-raw"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
authors = ["RAGTUX LLC"]
repository = "https://github.com/ragtux/LAPSTACK"
homepage = "https://lapstack.ragtux.com"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
rayon = "1.10"
# GPU (optional): dynamic-loading = dlopen libcuda/libnvrtc at runtime (no CUDA at
# build time; NixOS-friendly). Enable with `--features gpu`.
cudarc = { version = "0.16", default-features = false, features = ["driver", "nvrtc", "cuda-12050", "dynamic-loading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Debug builds: optimize dependencies (rayon/image) so a `cargo build` binary is
# usable without --release.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.lapstack-core]
opt-level = 3

[profile.dev.package.lapstack-raw]
opt-level = 3
